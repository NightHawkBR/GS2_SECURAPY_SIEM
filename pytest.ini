[pytest]
pythonpath = .
testpaths = testes
addopts = -ra
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock
markers =
    nucleo: módulo A — núcleo do 1º semestre
    persistencia: módulo B — MongoDB e MySQL
    ml: módulo C — machine learning
    api: módulo D — API REST
    web: módulo E — segurança web e dashboard
    docker: módulo F — empacotamento
    llm: módulo G — assistente LLM
    jwt: bônus — autenticação JWT
    temporal: bônus — correlação temporal
    tempo_real: módulo A — servidor de alertas dentro da plataforma
